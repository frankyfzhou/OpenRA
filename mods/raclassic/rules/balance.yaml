# Red Alert Classic Balance Overrides
# Restores original Red Alert Aftermath (v3.03) multiplayer balance.
# Source: OpenRA/raclassic ref/Rules.ini + ref/mplayer.ini + ref/aftrmath.ini
# Applied AFTER all RA rules — later values win in MiniYaml merge.
# HP conversion: original Strength × 100 = OpenRA HP.

