Player:
	ModularBot@RushAI:
		Name: Rush AI
		Type: rush
	ModularBot@NormalAI:
		Name: Normal AI
		Type: normal
	ModularBot@TurtleAI:
		Name: Turtle AI
		Type: turtle
	ModularBot@AirAI:
		Name: Air AI
		Type: air
	GrantConditionOnBotOwner@rush:
		Condition: enable-rush-ai
		Bots: rush
	GrantConditionOnBotOwner@normal:
		Condition: enable-normal-ai
		Bots: normal
	GrantConditionOnBotOwner@turtle:
		Condition: enable-turtle-ai
		Bots: turtle
	GrantConditionOnBotOwner@air:
		Condition: enable-air-ai
		Bots: air
	HarvesterBotModule@rush-air:
		RequiresCondition: enable-rush-ai || enable-air-ai
		HarvesterTypes: harv
		RefineryTypes: proc
		InitialHarvesters: 2
	HarvesterBotModule@normal-turtle:
		RequiresCondition: enable-normal-ai || enable-turtle-ai
		HarvesterTypes: harv
		RefineryTypes: proc
		InitialHarvesters: 4
	PowerDownBotModule:
		RequiresCondition: enable-rush-ai || enable-normal-ai || enable-turtle-ai || enable-air-ai
		PowerDownTypes: garadr, naradr, gavulc, garock, gacsam, gactwr, naobel, nalasr, nasam
	ResourceMapBotModule:
		RequiresCondition: enable-rush-ai || enable-normal-ai || enable-turtle-ai || enable-air-ai
		ResourceCreatorTypes: tibtre01, tibtre02, tibtre03, bigblue, bigblue3
		ValuableResourceTypes: Tiberium, BlueTiberium
		HarvesterTypes: harv
		RefineryTypes: proc
		EnemyBaseBuildingTypes: gacnst, gapowr, gapowrup, napowr, naapwr, gapile, nahand, gaweap, naweap, garadr, naradr, gahpad, nahpad, gatech, natech, gavulc, garock, gacsam, gactwr, naobel, nalasr, nasam
	SupportPowerBotModule:
		RequiresCondition: enable-rush-ai || enable-normal-ai || enable-turtle-ai || enable-air-ai
		Decisions:
			ioncannon:
				OrderName: IonCannonPowerOrder
				MinimumAttractiveness: 3000
				Consideration@1:
					Against: Enemy
					Types: Structure
					Attractiveness: 1
					TargetMetric: Value
					CheckRadius: 5c0
				Consideration@2:
					Against: Ally
					Types: Air, Ground, Water
					Attractiveness: -10
					TargetMetric: Value
					CheckRadius: 7c0
			nuke:
				OrderName: NukePowerOrder
				MinimumAttractiveness: 3000
				Consideration@1:
					Against: Enemy
					Types: Structure
					Attractiveness: 1
					TargetMetric: Value
					CheckRadius: 5c0
				Consideration@2:
					Against: Ally
					Types: Air, Ground, Water
					Attractiveness: -10
					TargetMetric: Value
					CheckRadius: 7c0
	BuildingRepairBotModule:
		RequiresCondition: enable-rush-ai || enable-normal-ai || enable-turtle-ai || enable-air-ai
	McvManagerBotModule:
		RequiresCondition: enable-rush-ai || enable-normal-ai || enable-turtle-ai || enable-air-ai
		McvTypes: mcv
		ConstructionYardTypes: gacnst
		McvFactoryTypes: gaweap, naweap
		MaxMcvOrdersPerGame: 3
	CaptureManagerBotModule:
		RequiresCondition: enable-normal-ai || enable-turtle-ai
		CapturingActorTypes: ghost, mhijack
		CapturableActorTypes: gapowr, gapowrup, napowr, naapwr, proc, garadr, naradr, gatech, natech

